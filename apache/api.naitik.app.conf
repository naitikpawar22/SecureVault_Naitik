<VirtualHost *:80>
    ServerName api.naitik.app
    
    # Reverse Proxy settings for Node.js Express Backend
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward client IP and scheme headers
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}

    # Pass all traffic to the Node.js process listening on port 5000
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Allow up to 1GB uploads for encrypted large files
    LimitRequestBody 1073741824

    # Keep alive and long timeouts for chunked/multipart uploads
    ProxyTimeout 600
    Timeout 600

    # Custom log paths
    ErrorLog ${APACHE_LOG_DIR}/api_naitik_app_error.log
    CustomLog ${APACHE_LOG_DIR}/api_naitik_app_access.log combined
</VirtualHost>
