<VirtualHost *:80>
    ServerName naitik.app
    ServerAlias www.naitik.app
    
    # Path to Vite compiled frontend
    DocumentRoot /var/www/securevault/client/dist

    <Directory /var/www/securevault/client/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Custom log paths
    ErrorLog ${APACHE_LOG_DIR}/naitik_app_error.log
    CustomLog ${APACHE_LOG_DIR}/naitik_app_access.log combined
</VirtualHost>
